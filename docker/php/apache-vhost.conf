ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/www/html/storage/logs/apache-error.log
    CustomLog /var/www/html/storage/logs/apache-access.log combined
</VirtualHost>
