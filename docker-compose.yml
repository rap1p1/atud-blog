name: atud-blog

services:
  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-atud_blog}
      DB_NAME: ${DB_NAME:-atud_blog}
      DB_USER: ${DB_USER:-atud_app}
      DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - lab

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-fixed}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-atud_blog}
      DB_USER: ${DB_USER:-atud_app}
      DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lab

  attacker:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATTACKER_PORT:-8088}:80"
    volumes:
      - ./attacker:/usr/share/nginx/html:ro
    networks:
      - lab

networks:
  lab:
    driver: bridge

volumes:
  db_data:
